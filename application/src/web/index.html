<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!-- the double-brace placeholders are filled in by the server: a room link gets its own title and description -->
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#14151b">
  <link rel="canonical" href="{{url}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Global Metronome">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{origin}}/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Three phones showing 120 BPM, all lighting the same beat. Every device. The same beat.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/qrcode.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <pulse-app></pulse-app>
</body>
</html>
