<!doctype html>
<!-- Source of src/web/og.png (the link-preview image). Render at 1200x630 with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 --screenshot=src/web/og.png tools/og.html -->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; position: relative; color: #f2f3f7; background: #14151b; font-family: -apple-system, system-ui, sans-serif; }
  #wave { position: absolute; top: -150px; right: -150px; width: 1180px; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #14151b 0%, rgb(20 21 27 / .86) 34%, rgb(20 21 27 / .3) 62%, transparent 80%), linear-gradient(0deg, #14151b 0%, transparent 30%); }
  .copy { position: absolute; left: 80px; top: 76px; }
  .brand { display: flex; align-items: center; gap: 16px; color: #a9acbd; font-size: 23px; font-weight: 600; letter-spacing: .22em; }
  .brand i { width: 16px; height: 16px; border-radius: 50%; background: #d6ebf8; box-shadow: 0 0 22px #d6ebf8, 0 0 60px #5aa2d6; }
  h1 { margin-top: 58px; font-size: 88px; font-weight: 200; line-height: 1.04; letter-spacing: -.035em; }
  h1 b { font-weight: 700; background: linear-gradient(90deg, #7fd0ff, #6f7dff 55%, #b08bff); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 28px; color: #a9acbd; font-size: 29px; font-weight: 400; }
  .url { position: absolute; left: 80px; bottom: 62px; color: #6c9ab8; font-size: 27px; font-weight: 600; letter-spacing: .02em; }
  /* three devices, one beat: every screen lights the same dot */
  .devices { position: absolute; right: 64px; bottom: 56px; display: flex; align-items: flex-end; gap: 22px; }
  .dev { display: grid; justify-items: center; align-content: center; gap: 14px; background: rgb(31 32 41 / .82); border: 1.5px solid rgb(255 255 255 / .16); box-shadow: 0 30px 70px rgb(0 0 0 / .55); backdrop-filter: blur(6px); }
  .dev b { font-weight: 200; letter-spacing: -.03em; line-height: 1; }
  .dev small { color: #8d90a3; letter-spacing: .14em; font-weight: 500; }
  .dots { display: flex; }
  .dots i { border: 1.5px solid #8d90a3; border-radius: 50%; }
  .dots i:first-child { background: #d6ebf8; border-color: #d6ebf8; box-shadow: 0 0 16px #d6ebf8, 0 0 34px #5aa2d6; }
  .s { width: 132px; height: 236px; border-radius: 26px; } .s b { font-size: 54px; } .s small { font-size: 12px; } .s .dots { gap: 11px; } .s .dots i { width: 11px; height: 11px; }
  .m { width: 168px; height: 300px; border-radius: 32px; } .m b { font-size: 70px; } .m small { font-size: 14px; } .m .dots { gap: 14px; } .m .dots i { width: 13px; height: 13px; }
</style>
<svg id="wave" viewBox="0 0 400 240"></svg>
<div class="fade"></div>
<div class="copy">
  <div class="brand"><i></i>GLOBAL METRONOME</div>
  <h1>Every device.<br><b>The same beat.</b></h1>
  <p class="sub">Open a room, share the link, play in sync.</p>
</div>
<div class="url">pulse.kurz.fyi</div>
<div class="devices">
  <div class="dev s"><div class="dots"><i></i><i></i><i></i><i></i></div><b>120</b><small>BPM</small></div>
  <div class="dev m"><div class="dots"><i></i><i></i><i></i><i></i></div><b>120</b><small>BPM</small></div>
  <div class="dev s"><div class="dots"><i></i><i></i><i></i><i></i></div><b>120</b><small>BPM</small></div>
</div>
<script>
  // Same curves as wave() in src/web/app.js.
  const W = 400, H = 240, N = 46, P = 90, g = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
  const hi = x => .62 - .5 * g(x, .34, .14) - .2 * g(x, .88, .09), lo = x => .62 + .28 * g(x, .6, .16);
  let out = `<defs><linearGradient id="wv"><stop offset="0" stop-color="#2aa1ff"/><stop offset=".55" stop-color="#2d3bff"/><stop offset="1" stop-color="#8a4bff"/></linearGradient></defs>`;
  for (let k = 0; k < N; k++) {
    const s = k / (N - 1);
    let d = "";
    for (let i = 0; i <= P; i++) {
      const x = i / P, y = hi(x) + (lo(x) - hi(x)) * s + .012 * Math.sin(14 * x + 7 * s) * g(x, .5, .35);
      d += `${i ? "L" : "M"}${(x * W).toFixed(1)} ${(y * H).toFixed(1)}`;
    }
    out += `<path d="${d}" fill="none" stroke="url(#wv)" stroke-width=".7" opacity=".8"/>`;
  }
  document.getElementById("wave").innerHTML = out;
</script>
